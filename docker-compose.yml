version: '3.8'

services:
  mysql:
    image: mysql:8.4
    container_name: support-mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: customer_support   # Đã đổi về customer_support cho khớp với application.yml
      MYSQL_USER: support
      MYSQL_PASSWORD: support123
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "3306:3306"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - mysqldata:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql  # Tự động tạo table khi chạy lần đầu
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 10s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: support-phpmyadmin
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    depends_on:
      mysql:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant:latest
    container_name: support-qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrantdata:/qdrant/storage

  n8n:
    image: n8nio/n8n:latest
    container_name: support-n8n
    ports:
      - "5678:5678"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - GENERIC_TIMEZONE=Asia/Ho_Chi_Minh
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - n8ndata:/home/node/.n8n
    depends_on:
      mysql:
        condition: service_healthy
      qdrant:
        condition: service_started

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: support-backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/customer_support?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root123}
      N8N_CHAT_WEBHOOK_URL: ${N8N_CHAT_WEBHOOK_URL:-http://n8n:5678/webhook/chat}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-key-at-least-32-characters-long}
      N8N_API_KEY: ${N8N_API_KEY:-n8n-super-secret-key-2026}
      SEED_ENABLED: ${SEED_ENABLED:-true}
      SEED_PASSWORD: ${SEED_PASSWORD:-ChangeMe@123}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: support-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mysqldata:
  qdrantdata:
  n8ndata: